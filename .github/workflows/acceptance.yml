name: acceptance

# Started by hand only (`gh workflow run acceptance`): the model-free acceptance scenarios, the chaos stand among
# them. Nothing runs them on a commit; the gate of a change is the workflow `ci`.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
      - run: mise run acceptance-ci
      # A failed scenario keeps its daemon's tree (aae-acceptance names it in the report row).
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-failures
          path: |
            /tmp/aae-acceptance-*/daemon.log
            /tmp/aae-acceptance-*/state/aae/journal/
            /tmp/aae-acceptance-*/state/aae/state.db*
          if-no-files-found: ignore
