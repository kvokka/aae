name: release
run-name: ${{ github.event_name == 'workflow_dispatch' && 'Release dry-run' || github.ref_name }}

on:
  workflow_dispatch:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.100
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Check release tag
        if: github.event_name == 'push'
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "loop-manager") | .version')
          test "$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, workspace $version" >&2; exit 1; }
      - name: Install musl compiler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y musl-tools
          echo "TARGET_CC=musl-gcc" >> "$GITHUB_ENV"
      - name: Build and package
        run: |
          cargo build --release --locked -p loop-manager --target "$TARGET"
          mkdir dist
          cd dist
          archive="loop-manager-$TARGET.tar.gz"
          tar -czf "$archive" -C "../target/$TARGET/release" loop-manager
          shasum -a 256 "$archive" > "$archive.sha256"
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/loop-manager" --version
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  github-release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      # A re-run of the tag replaces the assets of the release it made before.
      - name: Create the release and upload the binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  crates-io:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.100
      - uses: Swatinem/rust-cache@v2
      # A version on crates.io cannot be replaced: a re-run of the tag publishes only the crates not there yet.
      - name: Publish the crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          version="$GITHUB_REF_NAME"
          crates=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.publish != []) | .name')
          skip=()
          for name in $crates; do
            if curl -sf "https://index.crates.io/${name:0:2}/${name:2:2}/$name" | grep -q "\"vers\":\"$version\""; then
              skip+=(--exclude "$name")
            fi
          done
          if [ "${#skip[@]}" -eq "$((2 * $(wc -w <<< "$crates")))" ]; then
            echo "every crate is on crates.io at $version already"
            exit 0
          fi
          cargo publish --workspace --locked "${skip[@]}"
