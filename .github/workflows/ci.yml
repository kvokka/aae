name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - uses: Swatinem/rust-cache@v2
      - run: mise run ci

  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - uses: Swatinem/rust-cache@v2
      - run: mise run build-all
      - name: Built binary runs without extra runtimes
        run: target/aarch64-unknown-linux-musl/release/aae --version
