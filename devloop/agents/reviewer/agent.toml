# The defaults of the role; loop-manager.toml may change them in `[agents.reviewer]`. It calls no subagents.
harness = "claude"
model = "opus"
effort = "high"
# The addon's default budget; each round's review is a session of its own. `dcg` refuses a destructive shell command.
addons = [{ name = "context-budget" }, { name = "dcg" }]
