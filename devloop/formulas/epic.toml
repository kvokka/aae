name = "epic"
description = "One epic of loop-manager's own development: rounds of a coder, the full test run and a review, until the review passes"
# A review under the bar starts another round, whatever the tests say; an answer from the owner also starts a new
# round. A run still sent back after the last round fails and waits for the owner (`bead_failed_runs = 1`).
rounds = 50

[inputs]
epic = { type = "task", required = true }   # the bead of the epic

# The coder of the round: a new session each round, with the epic, its last comments and what the gate said. It hands
# over whatever it reached; a session stopped at its context limit hands over too (`cut = "pass"` in agent.toml).
[[step]]
name = "code"
kind = "ai"
agent = "coder"
last_comments = 8

# A genuine blocker ends the model session and waits for the owner. Resolving with `pass` records the answer and
# starts a new coder round; `fail` rejects the work and ends the run. Discretionary choices do not enter this wait.
[[step]]
name = "code_owner"
kind = "await"
if = { "steps.code.data.needs_owner" = true }
timeout = "168h"

[[step]]
name = "code_answer"
kind = "exec"
command = ["sh", "devloop/scripts/owner-answer.sh", "code"]
if = { "steps.code.data.needs_owner" = true }
back_to = "code"

# The full gate of the repository on the tree the coder left. Not a check: the script exits 0 red or green, and its
# output is in the reviewer's prompt.
[[step]]
name = "tests"
kind = "exec"
command = ["sh", "devloop/scripts/tests.sh"]
timeout = "60m"
inherit_env = true   # the toolchain variables of the shell that started the daemon

# The reviewer leaves the review as a comment on the epic and its score and verdict as the data of its outcome. A
# review that could not be written (the session failed or was stopped) is written once more by a new session.
[[step]]
name = "review"
kind = "ai"
agent = "reviewer"
max_attempts = 2
last_comments = 8

# The review can discover a blocker too. Its answer is handed to a new coder by the same path.
[[step]]
name = "review_owner"
kind = "await"
if = { "steps.review.data.needs_owner" = true }
timeout = "168h"

[[step]]
name = "review_answer"
kind = "exec"
command = ["sh", "devloop/scripts/owner-answer.sh", "review"]
if = { "steps.review.data.needs_owner" = true }
back_to = "code"

# Commits the tracker and pushes, whatever the review says; passes when the review scores 9 or more with the verdict
# `complete`, and sends the run back to the coder otherwise. The command runs in the rig, the root of the repository.
[[step]]
name = "gate"
kind = "exec"
command = ["sh", "devloop/scripts/gate.sh"]
timeout = "10m"
inherit_env = true   # `git push` authenticates as the shell that started the daemon (README.md, "The push")
back_to = "code"

# Package the completed epic and owner handoff without a model, after the review gate passed. Its stdout is the
# run's result for a caller. The report, comment snapshot and test digests are committed with the final tracker
# state; full logs and materials are kept in the ignored local artifacts directory.
[[step]]
name = "report"
kind = "exec"
command = ["sh", "devloop/scripts/report.sh"]
timeout = "10m"
inherit_env = true
