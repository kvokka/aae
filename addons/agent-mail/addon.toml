name = "agent-mail"
version = "0.1.0"
harnesses = ["claude", "codex"]
prompt = "prompt.md"

[params]
# The mail project of the rig; empty: the canonical path of the rig's repository (its own path outside Git).
project_key = ""
# Seconds a reservation lasts unless renewed.
ttl = 3600
# The thread of the runs; empty: one per chain of runs (the project and the run's correlation).
thread = ""

[agent.env]
LOOP_MANAGER_AGENT_MAIL_DATA = "${LOOP_MANAGER_ADDON_DATA}"

[agent.hooks.agent-mail-start]
event = "SessionStart"
command = "'${LOOP_MANAGER_ADDON_DIR}/bin/lm-agent-mail' session-start"
timeout = "30s"

[[hook]]
on = "run.preparing"
command = ["bin/lm-agent-mail", "prepare"]

[[hook]]
on = "run.passed"
command = ["bin/lm-agent-mail", "release"]

[[hook]]
on = "run.failed"
command = ["bin/lm-agent-mail", "release"]

[[hook]]
on = "run.cancelled"
command = ["bin/lm-agent-mail", "release"]

# One server for every session of the daemon: nothing of a run, rig or project goes here, or the daemon would start
# one per value (docs/design/config.md, "MCP servers and services").
[[service]]
name = "agent-mail"
scope = "orchestrator"
command = ["${LOOP_MANAGER_ADDON_DIR}/bin/lm-agent-mail", "serve", "${LOOP_MANAGER_ADDON_DATA}"]
health = { http = "/health/readiness" }
mcp = { url = "/mcp/" }
