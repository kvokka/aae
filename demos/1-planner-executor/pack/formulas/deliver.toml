name = "deliver"
description = "A request becomes beads per rig, coders do them, and the report says what got done"

[inputs]
task = { type = "task", required = true }   # the request: its text becomes the root bead

[[step]]
name = "plan"
kind = "ai"
agent = "planner"
timeout = "20m"

[[step]]
name = "work"
kind = "drain"
formula = "implement"                       # a run per bead under the root, on the rig of the prefix of its id
pool = 2                                    # two beads in work at once

# The beads under the root as they are, and whether all of them are closed.
[[step]]
name = "report"
kind = "exec"
command = ["sh", "-c", """
br dep tree "$AAE_BEAD" --direction up --no-color
echo "drain: $AAE_STEP_WORK_DATA"
br show "$AAE_BEAD" --json | jq -e '(if type == "array" then .[0] else . end).dependents // []
  | map(select(.dependency_type == "parent-child")) | length > 0 and all(.status == "closed")' >/dev/null
"""]
