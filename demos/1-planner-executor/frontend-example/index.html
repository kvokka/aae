<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="layout">
    <section class="game" aria-labelledby="game-title">
      <h1 id="game-title">Snake</h1>
      <p class="score-line">Score: <span id="score">0</span></p>
      <canvas id="board" width="400" height="400" aria-label="Snake game board"></canvas>
      <p id="status" class="status" role="status">Press Space or Enter to start. Steer with arrow keys or WASD.</p>

      <form id="save-form" class="save-form" hidden>
        <label for="player-name">Enter your name to save this score:</label>
        <div class="save-row">
          <input id="player-name" type="text" maxlength="20" autocomplete="off" placeholder="Player">
          <button id="save-button" type="submit">Save score</button>
        </div>
        <p id="save-message" class="message" role="alert"></p>
      </form>
    </section>

    <section class="leaderboard" aria-labelledby="leaderboard-title">
      <h2 id="leaderboard-title">High scores</h2>
      <p id="leaderboard-message" class="message" role="status"></p>
      <table id="leaderboard-table" hidden>
        <thead>
          <tr>
            <th scope="col">#</th>
            <th scope="col">Name</th>
            <th scope="col">Score</th>
            <th scope="col">Date</th>
          </tr>
        </thead>
        <tbody id="leaderboard-body"></tbody>
      </table>
    </section>
  </main>

  <script src="game.js"></script>
</body>
</html>
