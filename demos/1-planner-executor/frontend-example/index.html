<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake</title>
  <link rel="stylesheet" href="style.css">
  <script src="game.js" defer></script>
</head>
<body>
  <main class="layout">
    <section class="game">
      <h1>Snake</h1>
      <p class="score">Score: <span id="score">0</span></p>
      <canvas id="board" width="400" height="400"></canvas>
      <p id="status" class="status">Press an arrow key to start</p>

      <section id="game-over" class="panel" hidden>
        <p id="game-over-text" class="game-over-text"></p>
        <label for="player-name">Name</label>
        <input id="player-name" type="text" maxlength="20" placeholder="Anonymous" autocomplete="off">
        <div class="buttons">
          <button id="save-btn" type="button">Save score</button>
          <button id="play-again-btn" type="button">Play again</button>
        </div>
        <p id="save-message" class="message" role="status"></p>
      </section>
    </section>

    <section class="leaderboard">
      <h2>Leaderboard</h2>
      <div id="leaderboard" class="leaderboard-body">Loading...</div>
    </section>
  </main>
</body>
</html>
