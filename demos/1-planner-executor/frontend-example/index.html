<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="layout">
    <h1>Snake</h1>

    <div class="game">
      <canvas id="board" width="400" height="400" aria-label="Snake game board"></canvas>
      <p id="score" class="score">Score: 0</p>

      <form id="save-form" class="save-panel" hidden>
        <label for="name">Name</label>
        <div class="save-row">
          <input id="name" type="text" maxlength="20" autocomplete="nickname" placeholder="Your name">
          <button id="save-button" type="submit">Save</button>
        </div>
        <p id="save-status" class="status" role="status"></p>
      </form>
    </div>

    <section class="leaderboard">
      <h2>High scores</h2>
      <p id="leaderboard-status" class="status" role="status"></p>
      <ol id="leaderboard"></ol>
    </section>
  </main>

  <script src="game.js" defer></script>
</body>
</html>
