<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Snake</h1>
    <div class="game">
      <canvas id="board" width="400" height="400" aria-label="Snake game board"></canvas>
      <div class="panel">
        <p class="score">Score: <span id="score">0</span></p>
        <button id="start" type="button">Start / restart</button>
        <p id="status" role="status">Press Start or Space to play.</p>
        <p class="hint">Arrow keys or WASD to steer. Space starts a new game.</p>
        <section>
          <h2>High scores</h2>
          <p id="scores-status" class="hint"></p>
          <ol id="scores"></ol>
        </section>
      </div>
    </div>
  </main>
  <script src="game.js"></script>
</body>
</html>
