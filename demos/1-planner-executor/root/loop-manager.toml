name = "planner-executor"
packs = ["../pack"]                   # the agents and the formulas; the task comes from the user at the start

# The user's settings: what the agents of the pack run on here, and how.
[settings]
inherit_host = false                  # only what this config sets reaches the agents; the logins come from the host
# The permission mode is each harness's own setting: the demo runs unattended, each agent in a directory of its own.
[settings.native.claude]
permission_mode = "bypassPermissions" # claude's `--permission-mode`
[settings.native.codex]
approval_policy = "never"             # codex's approval policy

[agents.planner]                      # the pack's planner, over its defaults: the cheapest claude model
model = "haiku"
[agents.coder]
model = "haiku"

# `vars.harness` tells the planner what the coder of the rig runs on, for the `harness:` label of its beads; a bead
# whose label disagrees with the config gets no run.
[rigs.frontend]
path = "../frontend"
vars = { harness = "claude" }         # the coder runs on claude here, as in the whole project
[rigs.backend]
path = "../backend"
prefix = "api"                        # its beads are `api-…`, not the acronym `b-…`
vars = { harness = "codex" }
[rigs.backend.agents.coder]           # on this rig the same coder runs on codex
harness = "codex"
model = "luna"                        # the adapter expands it to the latest luna
