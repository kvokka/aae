<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake</title>
<style>
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #1d1f27;
    color: #e8e8e8;
    margin: 0;
    padding: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  h1 { margin: 0; font-size: 28px; }
  #layout {
    display: flex;
    gap: 24px;
    align-items: flex-start;
    flex-wrap: wrap;
    justify-content: center;
  }
  #board {
    background: #101217;
    border: 2px solid #3a3f4b;
    border-radius: 6px;
    display: block;
  }
  #side {
    min-width: 220px;
    background: #272a34;
    border-radius: 6px;
    padding: 16px;
  }
  #score { font-size: 22px; margin: 0 0 12px; }
  button {
    font: inherit;
    font-size: 16px;
    padding: 8px 18px;
    border: none;
    border-radius: 4px;
    background: #4caf50;
    color: #fff;
    cursor: pointer;
  }
  button:hover { background: #5cc160; }
  #status { min-height: 1.4em; margin: 12px 0 0; color: #ffb74d; font-size: 14px; }
  h2 { font-size: 18px; margin: 0 0 8px; }
  #scores { margin: 0; padding-left: 24px; font-family: ui-monospace, Menlo, Consolas, monospace; }
  #scores li { margin: 2px 0; }
  #help { color: #9aa0ad; font-size: 13px; margin: 0; }
</style>
</head>
<body>
<h1>Snake</h1>

<div id="layout">
  <canvas id="board" width="400" height="400"></canvas>

  <div id="side">
    <p id="score">Score: 0</p>
    <button id="startBtn" type="button">Start</button>
    <p id="help">Arrow keys to steer. Start with a key press or the button.
      You cannot reverse into your own neck.</p>
    <p id="status" role="status" aria-live="polite"></p>

    <h2>Top 10</h2>
    <ol id="scores"></ol>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ---- Configuration -------------------------------------------------------
  // Backend base URL. Score endpoint: http://127.0.0.1:8765/scores
  const BACKEND_URL = 'http://127.0.0.1:8765';
  const SCORES_URL = BACKEND_URL + '/scores';

  const COLS = 20;
  const ROWS = 20;
  const CELL = 20;          // px per cell; board is COLS*CELL x ROWS*CELL
  const TICK_MS = 120;      // time per snake step
  const MAX_TOP = 10;

  const DIRS = {
    ArrowUp:    { x: 0,  y: -1 },
    ArrowDown:  { x: 0,  y: 1 },
    ArrowLeft:  { x: -1, y: 0 },
    ArrowRight: { x: 1,  y: 0 }
  };

  // ---- DOM -----------------------------------------------------------------
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const startBtn = document.getElementById('startBtn');
  const statusEl = document.getElementById('status');
  const scoresEl = document.getElementById('scores');

  // ---- Game state ----------------------------------------------------------
  let snake = [];          // snake[0] is the head
  let dir = DIRS.ArrowRight;
  let pending = [];        // queued direction changes (max 2)
  let food = { x: 0, y: 0 };
  let score = 0;
  let state = 'idle';      // 'idle' | 'running' | 'over'
  let timer = null;
  let message = 'Press an arrow key or Start to play.';

  function setStatus(text) {
    statusEl.textContent = text;
  }

  function sameCell(a, b) {
    return a.x === b.x && a.y === b.y;
  }

  function placeFood() {
    for (;;) {
      const c = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
      if (!snake.some(function (s) { return sameCell(s, c); })) {
        food = c;
        return;
      }
    }
  }

  function resetGame() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = DIRS.ArrowRight;
    pending = [];
    score = 0;
    placeFood();
    updateScore();
  }

  function updateScore() {
    scoreEl.textContent = 'Score: ' + score;
  }

  // ---- Drawing -------------------------------------------------------------
  function draw() {
    const W = COLS * CELL;
    const H = ROWS * CELL;
    ctx.fillStyle = '#101217';
    ctx.fillRect(0, 0, W, H);

    // faint grid
    ctx.strokeStyle = '#1a1d26';
    ctx.lineWidth = 1;
    for (let i = 1; i < COLS; i++) {
      ctx.beginPath(); ctx.moveTo(i * CELL + 0.5, 0); ctx.lineTo(i * CELL + 0.5, H); ctx.stroke();
    }
    for (let j = 1; j < ROWS; j++) {
      ctx.beginPath(); ctx.moveTo(0, j * CELL + 0.5); ctx.lineTo(W, j * CELL + 0.5); ctx.stroke();
    }

    // food
    ctx.fillStyle = '#ef5350';
    ctx.beginPath();
    ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 3, 0, Math.PI * 2);
    ctx.fill();

    // snake
    for (let i = snake.length - 1; i >= 0; i--) {
      const s = snake[i];
      ctx.fillStyle = i === 0 ? '#a5d6a7' : '#4caf50';
      ctx.fillRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2);
    }

    // overlay when not running
    if (state !== 'running') {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = 'bold 24px system-ui, sans-serif';
      ctx.fillText(state === 'over' ? 'Game over' : 'Snake', W / 2, H / 2 - 20);
      ctx.font = '15px system-ui, sans-serif';
      ctx.fillText(message, W / 2, H / 2 + 14);
    }
  }

  // ---- Game loop -----------------------------------------------------------
  function startGame(firstDir) {
    if (state === 'running') return;
    resetGame();
    if (firstDir && !(firstDir.x === -dir.x && firstDir.y === -dir.y)) {
      dir = firstDir;
    }
    state = 'running';
    message = '';
    setStatus('');
    startBtn.textContent = 'Restart';
    timer = setInterval(step, TICK_MS);
    draw();
  }

  function step() {
    if (pending.length > 0) {
      dir = pending.shift();
    }
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // wall collision
    if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS) {
      return endGame();
    }

    const eating = sameCell(head, food);
    // when not eating, the tail cell will move away, so it is not a collision
    const body = eating ? snake : snake.slice(0, -1);
    if (body.some(function (s) { return sameCell(s, head); })) {
      return endGame();
    }

    snake.unshift(head);
    if (eating) {
      score += 1;
      updateScore();
      placeFood();
    } else {
      snake.pop();
    }
    draw();
  }

  function endGame() {
    clearInterval(timer);
    timer = null;
    state = 'over';
    message = 'Final score: ' + score;
    startBtn.textContent = 'Play again';
    draw();
    // Let the browser paint the final frame before the blocking prompt.
    setTimeout(askNameAndSubmit, 50);
  }

  // ---- Name & score submission --------------------------------------------
  function sanitizeName(raw) {
    const cleaned = String(raw == null ? '' : raw)
      .replace(/[\u0000-\u001f\u007f]/g, ' ')
      .trim()
      .replace(/\s+/g, '_')
      .slice(0, 32);
    return cleaned || 'anonymous';
  }

  function askNameAndSubmit() {
    const finalScore = score;
    const raw = window.prompt('Game over! Your score: ' + finalScore + '\nEnter your name:', '');
    const name = sanitizeName(raw);
    submitScore(name, finalScore);
  }

  async function submitScore(name, value) {
    setStatus('Saving score...');
    try {
      const res = await fetch(SCORES_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: name + ' ' + value
      });
      if (!res.ok) {
        throw new Error('HTTP ' + res.status);
      }
      setStatus('Score saved for ' + name + '.');
    } catch (err) {
      setStatus('Could not reach the score server');
    }
    state = 'idle';
    message = 'Press an arrow key or Start to play again.';
    startBtn.textContent = 'Start';
    draw();
    await loadScores();
  }

  // ---- Top 10 --------------------------------------------------------------
  async function loadScores() {
    try {
      const res = await fetch(SCORES_URL);
      if (!res.ok) {
        throw new Error('HTTP ' + res.status);
      }
      const text = await res.text();
      renderScores(text);
    } catch (err) {
      renderScores(null);
      setStatus('Could not reach the score server');
    }
  }

  function renderScores(text) {
    scoresEl.textContent = '';
    if (text === null) {
      const li = document.createElement('li');
      li.textContent = '(scores unavailable)';
      scoresEl.appendChild(li);
      return;
    }
    const lines = text.split(/\r?\n/)
      .map(function (l) { return l.trim(); })
      .filter(function (l) { return l.length > 0; })
      .slice(0, MAX_TOP);
    if (lines.length === 0) {
      const li = document.createElement('li');
      li.textContent = '(no scores yet)';
      scoresEl.appendChild(li);
      return;
    }
    lines.forEach(function (line) {
      const li = document.createElement('li');
      li.textContent = line;   // textContent: never interpreted as HTML
      scoresEl.appendChild(li);
    });
  }

  // ---- Input ---------------------------------------------------------------
  window.addEventListener('keydown', function (e) {
    if (Object.prototype.hasOwnProperty.call(DIRS, e.key)) {
      e.preventDefault();
      const want = DIRS[e.key];
      if (state !== 'running') {
        if (state === 'idle') startGame(want);
        return;
      }
      const last = pending.length > 0 ? pending[pending.length - 1] : dir;
      // reject reversing into the neck and no-op repeats
      if (want.x === -last.x && want.y === -last.y) return;
      if (want.x === last.x && want.y === last.y) return;
      if (pending.length < 2) pending.push(want);
    }
  });

  startBtn.addEventListener('click', function () {
    if (state === 'running') return;
    if (state === 'over') return;   // prompt/submission still pending
    startGame(null);
  });

  // ---- Init ----------------------------------------------------------------
  resetGame();
  draw();
  setStatus('');
  loadScores();
})();
</script>
</body>
</html>
