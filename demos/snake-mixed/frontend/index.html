<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake</title>
<style>
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #1e1e2e;
    color: #eee;
    margin: 0;
    padding: 24px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 24px;
    flex-wrap: wrap;
  }
  canvas {
    background: #111;
    border: 2px solid #444;
    display: block;
  }
  #panel {
    min-width: 220px;
    max-width: 280px;
  }
  #score {
    font-size: 1.6em;
    font-weight: bold;
    margin-bottom: 10px;
  }
  #message {
    min-height: 3em;
    margin-bottom: 10px;
    line-height: 1.4;
  }
  #nameForm {
    margin-bottom: 10px;
  }
  #nameForm label {
    display: block;
    margin-bottom: 6px;
  }
  input[type="text"], #nameInput {
    width: 100%;
    box-sizing: border-box;
    padding: 6px;
    font-size: 1em;
    background: #2a2a3c;
    color: #eee;
    border: 1px solid #555;
    border-radius: 4px;
  }
  button {
    padding: 6px 14px;
    font-size: 1em;
    background: #3a7bd5;
    color: #fff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    margin-top: 6px;
  }
  button:disabled {
    background: #555;
    cursor: default;
  }
  #status {
    min-height: 1.4em;
    margin-bottom: 8px;
  }
  .error {
    color: #ff6b6b;
  }
  .ok {
    color: #7ddc7d;
  }
  h2 {
    font-size: 1.2em;
    margin: 12px 0 6px;
  }
  #leaderboard {
    margin: 0;
    padding-left: 1.8em;
    line-height: 1.6;
    font-family: ui-monospace, Menlo, Consolas, monospace;
  }
</style>
</head>
<body>

<canvas id="board" width="400" height="400" aria-label="Snake game board"></canvas>

<div id="panel">
  <div id="score">Score: 0</div>
  <div id="message">Use the arrow keys to steer the snake.</div>

  <form id="nameForm" style="display:none" autocomplete="off">
    <label for="nameInput">Your name (spaces will be removed):</label>
    <input type="text" id="nameInput" maxlength="32">
    <button type="submit" id="submitBtn">Submit score</button>
  </form>

  <div id="status"></div>

  <h2>Top 10</h2>
  <ol id="leaderboard"></ol>

  <button id="restartBtn" style="display:none" type="button">Play again</button>
</div>

<script>
"use strict";

// Backend base URL. Edit here if the backend moves.
const API_BASE_URL = "http://127.0.0.1:8765";

const GRID_SIZE = 20;      // cells per side
const CELL_PX = 20;        // pixels per cell (GRID_SIZE * CELL_PX = canvas size)
const TICK_MS = 120;       // time per snake step

const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const messageEl = document.getElementById("message");
const nameForm = document.getElementById("nameForm");
const nameInput = document.getElementById("nameInput");
const submitBtn = document.getElementById("submitBtn");
const statusEl = document.getElementById("status");
const leaderboardEl = document.getElementById("leaderboard");
const restartBtn = document.getElementById("restartBtn");

const DIRECTIONS = {
  ArrowUp:    { x: 0,  y: -1 },
  ArrowDown:  { x: 0,  y: 1 },
  ArrowLeft:  { x: -1, y: 0 },
  ArrowRight: { x: 1,  y: 0 }
};

// Game state
let snake = [];
let direction = { x: 1, y: 0 };
let pendingDirections = [];   // queued turns, applied one per tick
let food = { x: 0, y: 0 };
let score = 0;
let phase = "idle";          // "playing" | "entering-name" | "submitting" | "done"
let tickTimer = null;

function startGame() {
  clearInterval(tickTimer);
  snake = [
    { x: 10, y: 10 },
    { x: 9, y: 10 },
    { x: 8, y: 10 }
  ];
  direction = { x: 1, y: 0 };
  pendingDirections = [];
  score = 0;
  food = placeFood();
  phase = "playing";

  nameForm.style.display = "none";
  restartBtn.style.display = "none";
  statusEl.textContent = "";
  statusEl.className = "";
  messageEl.textContent = "Use the arrow keys to steer the snake.";
  updateScore();
  draw();

  tickTimer = setInterval(step, TICK_MS);
}

function placeFood() {
  while (true) {
    const candidate = {
      x: Math.floor(Math.random() * GRID_SIZE),
      y: Math.floor(Math.random() * GRID_SIZE)
    };
    const onSnake = snake.some(s => s.x === candidate.x && s.y === candidate.y);
    if (!onSnake) return candidate;
  }
}

function step() {
  if (phase !== "playing") return;

  if (pendingDirections.length > 0) {
    direction = pendingDirections.shift();
  }

  const head = {
    x: snake[0].x + direction.x,
    y: snake[0].y + direction.y
  };

  // Wall collision
  if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
    endGame();
    return;
  }

  // Self collision
  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    endGame();
    return;
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 1;
    food = placeFood();
    updateScore();
  } else {
    snake.pop();
  }

  draw();
}

function updateScore() {
  scoreEl.textContent = "Score: " + score;
}

function draw() {
  const size = GRID_SIZE * CELL_PX;
  ctx.fillStyle = "#111";
  ctx.fillRect(0, 0, size, size);

  // Food
  ctx.fillStyle = "#ff4d4d";
  ctx.beginPath();
  ctx.arc(
    food.x * CELL_PX + CELL_PX / 2,
    food.y * CELL_PX + CELL_PX / 2,
    CELL_PX / 2 - 3,
    0, Math.PI * 2
  );
  ctx.fill();

  // Snake
  snake.forEach((seg, i) => {
    ctx.fillStyle = i === 0 ? "#b6f56b" : "#4caf50";
    ctx.fillRect(seg.x * CELL_PX + 1, seg.y * CELL_PX + 1, CELL_PX - 2, CELL_PX - 2);
  });

  if (phase === "entering-name" || phase === "submitting" || phase === "done") {
    ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
    ctx.fillRect(0, 0, size, size);
    ctx.fillStyle = "#fff";
    ctx.font = "bold 32px system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("GAME OVER", size / 2, size / 2);
  }
}

function endGame() {
  clearInterval(tickTimer);
  tickTimer = null;
  phase = "entering-name";
  draw();

  messageEl.textContent = "Game over! Your score: " + score + ".";
  nameForm.style.display = "block";
  nameInput.value = "";
  nameInput.focus();
}

// Arrow keys steer the snake while playing. Reversal into the body is refused.
document.addEventListener("keydown", (event) => {
  const dir = DIRECTIONS[event.key];
  if (!dir) return;
  if (phase !== "playing") return;   // let arrow keys work normally in the name field

  event.preventDefault();

  const last = pendingDirections.length > 0
    ? pendingDirections[pendingDirections.length - 1]
    : direction;

  // Same direction or reversal of the last committed direction: ignore.
  if (dir.x === last.x && dir.y === last.y) return;
  if (dir.x === -last.x && dir.y === -last.y) return;

  // Limit queued turns so input cannot pile up.
  if (pendingDirections.length < 2) {
    pendingDirections.push(dir);
  }
});

nameForm.addEventListener("submit", (event) => {
  event.preventDefault();
  if (phase !== "entering-name") return;

  const name = nameInput.value.replace(/\s+/g, "");
  if (name.length === 0) {
    statusEl.className = "error";
    statusEl.textContent = "Please enter a name (at least one non-space character).";
    return;
  }

  submitScore(name, score);
});

async function submitScore(name, finalScore) {
  phase = "submitting";
  submitBtn.disabled = true;
  nameForm.style.display = "none";
  statusEl.className = "";
  statusEl.textContent = "Saving score...";
  draw();

  // 1. POST the score
  try {
    const response = await fetch(API_BASE_URL + "/scores", {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: name + " " + finalScore
    });
    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }
    statusEl.className = "ok";
    statusEl.textContent = "Score saved.";
  } catch (err) {
    statusEl.className = "error";
    statusEl.textContent = "Could not save score: backend unreachable at " +
      API_BASE_URL + " (" + err.message + ").";
  }

  // 2. GET the top ten scores
  try {
    const response = await fetch(API_BASE_URL + "/scores");
    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }
    const text = await response.text();
    renderLeaderboard(text);
  } catch (err) {
    renderLeaderboard(null);
    statusEl.className = "error";
    statusEl.textContent = "Backend unreachable at " + API_BASE_URL +
      " - top scores could not be loaded (" + err.message + ").";
  }

  phase = "done";
  submitBtn.disabled = false;
  restartBtn.style.display = "inline-block";
  restartBtn.focus();
  draw();
}

function renderLeaderboard(text) {
  leaderboardEl.textContent = "";

  if (text === null) {
    const li = document.createElement("li");
    li.textContent = "(unavailable)";
    li.className = "error";
    leaderboardEl.appendChild(li);
    return;
  }

  const lines = text
    .split(/\r?\n/)
    .map(line => line.trim())
    .filter(line => line.length > 0)
    .slice(0, 10);

  if (lines.length === 0) {
    const li = document.createElement("li");
    li.textContent = "No scores yet.";
    leaderboardEl.appendChild(li);
    return;
  }

  for (const line of lines) {
    const li = document.createElement("li");
    li.textContent = line;   // textContent: never interpret the backend text as HTML
    leaderboardEl.appendChild(li);
  }
}

restartBtn.addEventListener("click", () => {
  startGame();
});

// Start a game as soon as the page loads.
startGame();
</script>
</body>
</html>
