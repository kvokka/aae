# The reviewer of the demo, in place of a human: it acts only through `gh`, as the owner of the repositories would.
scope = "root"                        # it works in the project root
harness = "codex"
model = "terra"
effort = "medium"
inherit_host = true                   # it works as the user does: the user's shell and tools
env = { GH_CONFIG_DIR = "../.aae/gh" } # the login of `gh` run.sh makes, from the project root
