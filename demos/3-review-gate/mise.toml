# What the demo needs besides aae; mise is a convenience, any install of these tools does.
[tools]
codex = "0"
gh = "2.103.2"                        # the pull requests, and the reviewer's only way to act
"github:Dicklesworthstone/beads_rust" = "0.7.6"
jq = "1.8.2"

[tasks.check]
description = "The pack and the project load"
run = "aae config check --config root/config.toml"

[tasks.demo]
description = "The demo from the request to its report; EXAMPLE=1 keeps the result as the *-example"
run = "./run.sh"
