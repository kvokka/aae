<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake</title>
<style>
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #1b1d23;
    color: #eee;
    margin: 0;
    padding: 24px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 32px;
    flex-wrap: wrap;
  }
  #game { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  canvas { background: #0d0f14; border: 2px solid #444; display: block; }
  #score-line { font-size: 1.2rem; }
  #score-line span { font-weight: bold; }
  .hint { color: #999; font-size: 0.9rem; }
  button { font-size: 1rem; padding: 6px 16px; cursor: pointer; }
  #status { min-height: 1.4em; color: #f1c40f; }
  #side { min-width: 260px; }
  #side h2 { margin: 0 0 8px 0; font-size: 1.3rem; }
  #scores { min-height: 2em; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid #333; }
  th.num, td.num { text-align: right; }
</style>
</head>
<body>
<div id="game">
  <canvas id="board" width="400" height="400"></canvas>
  <div id="score-line">Score: <span id="score">0</span></div>
  <div class="hint">Arrow keys steer. Space or Enter starts / restarts.</div>
  <button id="restart" type="button">Start / Restart</button>
  <div id="status" role="status" aria-live="polite"></div>
</div>
<div id="side">
  <h2>Top 10 scores</h2>
  <div id="scores">Loading…</div>
</div>

<script>
'use strict';

// Backend base address. Change here if the backend moves.
const API = 'http://127.0.0.1:8765';

const COLS = 20;
const ROWS = 20;
const CELL = 20;          // canvas is COLS*CELL x ROWS*CELL = 400x400
const TICK_MS = 120;      // snake moves every TICK_MS milliseconds
const MAX_NAME = 20;

const DIRS = new Map([
  ['ArrowLeft',  { x: -1, y: 0 }],
  ['ArrowRight', { x: 1,  y: 0 }],
  ['ArrowUp',    { x: 0,  y: -1 }],
  ['ArrowDown',  { x: 0,  y: 1 }],
]);

const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const statusEl = document.getElementById('status');
const scoresEl = document.getElementById('scores');
const restartBtn = document.getElementById('restart');

// state: 'ready' (before first game), 'playing', 'over' (after game over)
let state = 'ready';
let snake = [];          // array of {x, y}; snake[0] is the head
let dir = { x: 1, y: 0 };// direction currently applied
let queue = [];          // pending direction changes (max 2), applied one per tick
let food = null;
let score = 0;
let timer = null;

function setStatus(msg) {
  statusEl.textContent = msg;
}

function sameCell(a, b) {
  return a.x === b.x && a.y === b.y;
}

function placeFood() {
  const free = [];
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      if (!snake.some(s => s.x === x && s.y === y)) free.push({ x, y });
    }
  }
  food = free.length ? free[Math.floor(Math.random() * free.length)] : null;
}

function resetGame() {
  const cx = Math.floor(COLS / 2);
  const cy = Math.floor(ROWS / 2);
  snake = [{ x: cx, y: cy }, { x: cx - 1, y: cy }, { x: cx - 2, y: cy }];
  dir = { x: 1, y: 0 };
  queue = [];
  score = 0;
  scoreEl.textContent = '0';
  placeFood();
}

function startGame() {
  if (state === 'playing') return;
  clearInterval(timer);
  resetGame();
  state = 'playing';
  setStatus('');
  draw();
  timer = setInterval(tick, TICK_MS);
}

// Accept a direction change unless it repeats or reverses the last queued/applied direction.
function queueDir(d) {
  const base = queue.length ? queue[queue.length - 1] : dir;
  if (d.x === base.x && d.y === base.y) return;      // same direction
  if (d.x === -base.x && d.y === -base.y) return;    // reverse into itself
  if (queue.length < 2) queue.push(d);
}

function tick() {
  if (queue.length) dir = queue.shift();

  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS) {
    endGame();
    return;
  }

  const eating = food !== null && sameCell(head, food);
  // The tail cell moves away this tick unless we are growing, so it is not a collision.
  const body = eating ? snake : snake.slice(0, -1);
  if (body.some(s => sameCell(s, head))) {
    endGame();
    return;
  }

  snake.unshift(head);
  if (eating) {
    score++;
    scoreEl.textContent = String(score);
    placeFood();
    if (!food) {          // board completely filled
      endGame();
      return;
    }
  } else {
    snake.pop();
  }
  draw();
}

function endGame() {
  clearInterval(timer);
  timer = null;
  state = 'over';
  draw();
  setStatus('Game over. Press Space, Enter or the button to play again.');

  const name = askName(score);
  if (name === null) {
    setStatus('Game over. Score not sent. Press Space, Enter or the button to play again.');
    loadScores();
    return;
  }
  submitScore(name, score);
}

// Simple prompt. Spaces are replaced by underscores; empty names become "anonymous".
function askName(finalScore) {
  const raw = window.prompt(
    'Game over! Your score: ' + finalScore + '\nEnter your name (no spaces):', '');
  if (raw == null) return null;
  const name = raw.trim().replace(/\s+/g, '_').slice(0, MAX_NAME);
  return name || 'anonymous';
}

async function submitScore(name, value) {
  setStatus('Sending score…');
  try {
    const res = await fetch(API + '/scores', {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: name + ' ' + value,
    });
    if (res.status === 204 || res.ok) {
      setStatus('Score saved.');
    } else {
      setStatus('Server rejected the score (HTTP ' + res.status + ').');
    }
  } catch (err) {
    setStatus('backend unreachable: score not saved.');
  }
  await loadScores();
}

async function loadScores() {
  let res;
  try {
    res = await fetch(API + '/scores');
  } catch (err) {
    scoresEl.textContent = 'backend unreachable';
    return;
  }
  if (!res.ok) {
    scoresEl.textContent = 'Could not load scores (HTTP ' + res.status + ').';
    return;
  }
  let text;
  try {
    text = await res.text();
  } catch (err) {
    scoresEl.textContent = 'backend unreachable';
    return;
  }
  const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
  renderScores(lines.slice(0, 10));
}

// Each line is "<name> <score>". Built with textContent, never innerHTML.
function renderScores(lines) {
  scoresEl.textContent = '';
  if (lines.length === 0) {
    scoresEl.textContent = 'No scores yet.';
    return;
  }
  const table = document.createElement('table');
  const thead = document.createElement('thead');
  const headRow = document.createElement('tr');
  ['#', 'Name', 'Score'].forEach((title, i) => {
    const th = document.createElement('th');
    th.textContent = title;
    if (i === 2) th.className = 'num';
    headRow.appendChild(th);
  });
  thead.appendChild(headRow);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  lines.forEach((line, i) => {
    const m = line.match(/^(.*\S)\s+(\S+)$/);
    const name = m ? m[1] : line;
    const value = m ? m[2] : '';
    const tr = document.createElement('tr');
    const cells = [String(i + 1), name, value];
    cells.forEach((text, j) => {
      const td = document.createElement('td');
      td.textContent = text;
      if (j === 2) td.className = 'num';
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  scoresEl.appendChild(table);
}

function draw() {
  ctx.fillStyle = '#0d0f14';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  if (food) {
    ctx.fillStyle = '#e74c3c';
    ctx.fillRect(food.x * CELL + 3, food.y * CELL + 3, CELL - 6, CELL - 6);
  }
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#2ecc71' : '#27ae60';
    ctx.fillRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2);
  });

  if (state !== 'playing') {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.font = 'bold 24px sans-serif';
    if (state === 'ready') {
      ctx.fillText('Press Space or Enter', canvas.width / 2, canvas.height / 2 - 10);
      ctx.fillText('to start', canvas.width / 2, canvas.height / 2 + 24);
    } else {
      ctx.fillText('Game over', canvas.width / 2, canvas.height / 2 - 10);
      ctx.fillText('Score: ' + score, canvas.width / 2, canvas.height / 2 + 24);
    }
  }
}

document.addEventListener('keydown', (e) => {
  const d = DIRS.get(e.key);
  if (d) {
    e.preventDefault();
    if (state === 'ready') startGame();
    if (state === 'playing') queueDir(d);
    return;
  }
  if (e.key === ' ' || e.key === 'Spacebar' || e.key === 'Enter') {
    e.preventDefault();
    if (state !== 'playing' && !e.repeat) startGame();
  }
});

restartBtn.addEventListener('click', () => {
  if (state !== 'playing') startGame();
});

draw();
loadScores();
</script>
</body>
</html>
