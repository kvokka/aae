<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake</title>
<style>
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #1d1f24;
    color: #eee;
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 { margin: 0 0 8px; font-size: 28px; }
  #hud { font-size: 18px; margin-bottom: 8px; }
  canvas { background: #111; border: 2px solid #444; display: block; }
  #msg { min-height: 1.4em; margin: 10px 0; color: #ffd166; text-align: center; }
  button {
    font: inherit; font-size: 16px; padding: 6px 18px; cursor: pointer;
    background: #2a9d8f; color: #fff; border: none; border-radius: 4px;
  }
  button:disabled { background: #555; cursor: default; }
  #scores { margin-top: 16px; min-width: 260px; }
  #scores h2 { font-size: 20px; margin: 0 0 6px; text-align: center; }
  #scores table { width: 100%; border-collapse: collapse; }
  #scores th, #scores td { padding: 4px 10px; border-bottom: 1px solid #333; text-align: left; }
  #scores td.num, #scores th.num { text-align: right; }
  #scores-msg { color: #f4a261; text-align: center; min-height: 1.2em; margin-top: 6px; }
</style>
</head>
<body>
<h1>Snake</h1>
<div id="hud">Score: <span id="score">0</span></div>
<canvas id="board" width="400" height="400"></canvas>
<div id="msg">Press an arrow key or Space to start.</div>
<button id="play" type="button">Start</button>

<div id="scores">
  <h2>Top 10</h2>
  <table>
    <thead><tr><th>#</th><th>Name</th><th class="num">Score</th></tr></thead>
    <tbody id="scores-body"></tbody>
  </table>
  <div id="scores-msg"></div>
</div>

<script>
(function () {
  'use strict';

  var API = 'http://127.0.0.1:8765/scores';
  var COLS = 20, ROWS = 20, CELL = 20, TICK_MS = 120;
  var KEYCODES = { 37: 'ArrowLeft', 38: 'ArrowUp', 39: 'ArrowRight', 40: 'ArrowDown' };
  var DIRS = {
    ArrowLeft:  { x: -1, y: 0 },
    ArrowUp:    { x: 0,  y: -1 },
    ArrowRight: { x: 1,  y: 0 },
    ArrowDown:  { x: 0,  y: 1 }
  };

  var canvas = document.getElementById('board');
  var ctx = canvas.getContext('2d');
  var scoreEl = document.getElementById('score');
  var msgEl = document.getElementById('msg');
  var playBtn = document.getElementById('play');
  var scoresBody = document.getElementById('scores-body');
  var scoresMsg = document.getElementById('scores-msg');

  canvas.width = COLS * CELL;
  canvas.height = ROWS * CELL;

  // state: 'idle' (before first game), 'running', 'saving' (game over, asking for name / sending), 'over' (ready to replay)
  var state = 'idle';
  var snake = [];
  var dir = DIRS.ArrowRight;
  var nextDir = DIRS.ArrowRight;
  var food = null;
  var score = 0;
  var timer = null;

  function setMsg(text) { msgEl.textContent = text; }

  function updateControls() {
    var canStart = (state === 'idle' || state === 'over');
    playBtn.disabled = !canStart;
    playBtn.textContent = state === 'over' ? 'Play again' : 'Start';
  }

  function placeFood() {
    var free = [];
    for (var x = 0; x < COLS; x++) {
      for (var y = 0; y < ROWS; y++) {
        var occupied = false;
        for (var i = 0; i < snake.length; i++) {
          if (snake[i].x === x && snake[i].y === y) { occupied = true; break; }
        }
        if (!occupied) free.push({ x: x, y: y });
      }
    }
    if (free.length === 0) return null;
    return free[Math.floor(Math.random() * free.length)];
  }

  function draw() {
    ctx.fillStyle = '#111';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (food) {
      ctx.fillStyle = '#e63946';
      ctx.fillRect(food.x * CELL + 3, food.y * CELL + 3, CELL - 6, CELL - 6);
    }
    for (var i = 0; i < snake.length; i++) {
      ctx.fillStyle = i === 0 ? '#2a9d8f' : '#8ac926';
      ctx.fillRect(snake[i].x * CELL + 1, snake[i].y * CELL + 1, CELL - 2, CELL - 2);
    }

    if (state === 'saving' || state === 'over') {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 36px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
      ctx.textAlign = 'start';
    }
  }

  function startGame() {
    clearTimeout(timer);
    snake = [{ x: 6, y: 10 }, { x: 5, y: 10 }, { x: 4, y: 10 }];
    dir = DIRS.ArrowRight;
    nextDir = DIRS.ArrowRight;
    score = 0;
    scoreEl.textContent = '0';
    food = placeFood();
    state = 'running';
    setMsg('Use the arrow keys to steer.');
    updateControls();
    draw();
    timer = setTimeout(tick, TICK_MS);
  }

  function tick() {
    dir = nextDir;
    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    var eating = food && head.x === food.x && head.y === food.y;
    // When not eating, the tail cell will be vacated this tick, so it is safe to move into it.
    var body = eating ? snake : snake.slice(0, -1);

    var hitWall = head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS;
    var hitSelf = false;
    for (var i = 0; i < body.length; i++) {
      if (body[i].x === head.x && body[i].y === head.y) { hitSelf = true; break; }
    }
    if (hitWall || hitSelf) {
      gameOver();
      return;
    }

    snake.unshift(head);
    if (eating) {
      score++;
      scoreEl.textContent = String(score);
      food = placeFood();
      if (!food) { // board completely filled
        gameOver();
        return;
      }
    } else {
      snake.pop();
    }
    draw();
    timer = setTimeout(tick, TICK_MS);
  }

  function gameOver() {
    clearTimeout(timer);
    state = 'saving';
    updateControls();
    draw();
    setMsg('Game over with score ' + score + '. Enter your name to save it.');
    finishGame();
  }

  function sanitizeName(raw) {
    var name = (raw == null ? '' : String(raw)).trim().replace(/\s+/g, '_');
    return name || 'anon';
  }

  async function finishGame() {
    var raw = prompt('Game over! Your score: ' + score + '\nEnter your name (no spaces):', '');
    var name = sanitizeName(raw);

    var sent = await postScore(name, score);
    if (sent) {
      setMsg('Score saved as "' + name + '". Press Space/Enter or click "Play again".');
    } else {
      setMsg('Score NOT saved: backend unreachable. Press Space/Enter or click "Play again".');
    }
    await loadScores();

    state = 'over';
    updateControls();
    draw();
  }

  async function postScore(name, value) {
    try {
      var res = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: name + ' ' + value
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return true;
    } catch (err) {
      return false;
    }
  }

  function parseScores(text) {
    var result = [];
    var lines = String(text || '').split(/\r?\n/);
    for (var i = 0; i < lines.length && result.length < 10; i++) {
      var line = lines[i].trim();
      if (!line) continue;
      var m = line.match(/^(\S+)\s+(\S+)$/);
      if (m) result.push({ name: m[1], score: m[2] });
    }
    return result;
  }

  function renderScores(list) {
    scoresBody.textContent = '';
    if (list.length === 0) {
      var tr = document.createElement('tr');
      var td = document.createElement('td');
      td.colSpan = 3;
      td.textContent = 'No scores yet.';
      tr.appendChild(td);
      scoresBody.appendChild(tr);
      return;
    }
    list.forEach(function (entry, idx) {
      var tr = document.createElement('tr');
      var c1 = document.createElement('td');
      c1.textContent = String(idx + 1);
      var c2 = document.createElement('td');
      c2.textContent = entry.name;
      var c3 = document.createElement('td');
      c3.className = 'num';
      c3.textContent = entry.score;
      tr.appendChild(c1);
      tr.appendChild(c2);
      tr.appendChild(c3);
      scoresBody.appendChild(tr);
    });
  }

  async function loadScores() {
    try {
      var res = await fetch(API, { method: 'GET', cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var text = await res.text();
      renderScores(parseScores(text));
      scoresMsg.textContent = '';
      return true;
    } catch (err) {
      scoresMsg.textContent = 'Backend unreachable at 127.0.0.1:8765: high scores unavailable.';
      return false;
    }
  }

  document.addEventListener('keydown', function (e) {
    var key = e.key || KEYCODES[e.keyCode];
    var isArrow = Object.prototype.hasOwnProperty.call(DIRS, key);
    var isStart = key === ' ' || key === 'Spacebar' || key === 'Enter';

    if (isArrow) e.preventDefault();

    if (state === 'idle') {
      if (isArrow) { startGame(); steer(key); }
      else if (isStart) { e.preventDefault(); startGame(); }
      return;
    }
    if (state === 'running') {
      if (isArrow) steer(key);
      return;
    }
    if (state === 'over' && isStart) {
      e.preventDefault();
      if (!e.repeat) startGame();
    }
  });

  function steer(key) {
    var d = DIRS[key];
    // Reject reversing into the snake: compare against the direction actually applied on the last tick.
    if (d.x === -dir.x && d.y === -dir.y) return;
    nextDir = d;
  }

  playBtn.addEventListener('click', function () {
    if (state === 'idle' || state === 'over') startGame();
  });

  // Initial screen
  updateControls();
  draw();
  loadScores();
})();
</script>
</body>
</html>
