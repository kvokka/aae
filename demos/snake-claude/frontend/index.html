<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #1b1d22;
    color: #e8e8e8;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  h1 { margin: 0 0 16px; font-weight: 600; }
  #wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    align-items: flex-start;
    justify-content: center;
    padding: 0 16px;
  }
  canvas {
    background: #0e0f12;
    border: 2px solid #3a3e47;
    border-radius: 4px;
    display: block;
  }
  #side { min-width: 220px; max-width: 280px; }
  #score { font-size: 20px; margin: 0 0 8px; }
  #status { min-height: 1.4em; margin: 0 0 12px; color: #c9d1d9; }
  #again {
    font: inherit;
    padding: 8px 16px;
    border: 0;
    border-radius: 4px;
    background: #2ea043;
    color: #fff;
    cursor: pointer;
    margin-bottom: 16px;
  }
  #again:hover { background: #3fb950; }
  #again[hidden] { display: none; }
  h2 { font-size: 16px; margin: 0 0 8px; font-weight: 600; }
  #scores { margin: 0; padding-left: 24px; min-height: 2em; }
  #scores li { margin: 2px 0; font-variant-numeric: tabular-nums; }
  #scores .sc { float: right; margin-left: 12px; }
  #net { color: #f0883e; min-height: 1.2em; margin: 8px 0 0; }
</style>
</head>
<body>
<h1>Snake</h1>
<div id="wrap">
  <canvas id="board" width="400" height="400" aria-label="Snake game board"></canvas>
  <div id="side">
    <p id="score">Score: 0</p>
    <p id="status" role="status"></p>
    <button id="again" type="button" hidden>Play again</button>
    <h2>Top 10</h2>
    <ol id="scores"></ol>
    <p id="net" role="alert"></p>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ---- Configuration ------------------------------------------------------
  // Base URL of the scores backend. Change this single constant if needed.
  const API_BASE = 'http://127.0.0.1:8765';

  const GRID = 20;          // board is GRID x GRID cells
  const CELL = 20;          // pixels per cell (GRID * CELL = canvas size)
  const TICK_MS = 120;      // snake moves every TICK_MS milliseconds

  const DIRS = {
    ArrowUp:    { x: 0,  y: -1 },
    ArrowDown:  { x: 0,  y: 1 },
    ArrowLeft:  { x: -1, y: 0 },
    ArrowRight: { x: 1,  y: 0 }
  };

  // ---- DOM ----------------------------------------------------------------
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const statusEl = document.getElementById('status');
  const againBtn = document.getElementById('again');
  const scoresEl = document.getElementById('scores');
  const netEl = document.getElementById('net');

  // ---- Game state ---------------------------------------------------------
  // state: 'ready'      - waiting for the first arrow key
  //        'playing'    - snake is moving
  //        'over'       - game ended, name prompt about to appear
  //        'submitting' - score being posted / leaderboard being loaded
  //        'done'       - finished; arrow key or button starts a new game
  let state = 'ready';
  let snake = [];
  let dir = DIRS.ArrowRight;   // direction applied on the last tick
  let nextDir = DIRS.ArrowRight; // direction to apply on the next tick
  let food = null;
  let score = 0;
  let timer = null;
  let lastName = '';

  function isOpposite(a, b) {
    return a.x === -b.x && a.y === -b.y;
  }

  function sameCell(a, b) {
    return a.x === b.x && a.y === b.y;
  }

  function placeFood() {
    const occupied = new Set(snake.map(s => s.y * GRID + s.x));
    const free = [];
    for (let i = 0; i < GRID * GRID; i++) {
      if (!occupied.has(i)) free.push(i);
    }
    if (free.length === 0) return null;
    const idx = free[Math.floor(Math.random() * free.length)];
    return { x: idx % GRID, y: Math.floor(idx / GRID) };
  }

  function resetBoard() {
    const cx = Math.floor(GRID / 2);
    const cy = Math.floor(GRID / 2);
    snake = [{ x: cx, y: cy }, { x: cx - 1, y: cy }, { x: cx - 2, y: cy }];
    dir = DIRS.ArrowRight;
    nextDir = DIRS.ArrowRight;
    score = 0;
    food = placeFood();
    updateScore();
  }

  function startGame() {
    clearInterval(timer);
    resetBoard();
    state = 'playing';
    againBtn.hidden = true;
    setStatus('');
    setNet('');
    timer = setInterval(tick, TICK_MS);
    draw();
  }

  function tick() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) {
      gameOver();
      return;
    }

    const eating = food !== null && sameCell(head, food);
    // When not growing, the tail cell will vacate this tick, so it is free.
    const body = eating ? snake : snake.slice(0, -1);
    if (body.some(s => sameCell(s, head))) {
      gameOver();
      return;
    }

    snake.unshift(head);
    if (eating) {
      score += 1;
      food = placeFood();
      updateScore();
      if (food === null) {
        // Board is full: nothing left to place, treat as the end of the game.
        draw();
        gameOver();
        return;
      }
    } else {
      snake.pop();
    }
    draw();
  }

  function gameOver() {
    clearInterval(timer);
    timer = null;
    state = 'over';
    draw();
    setStatus('Game over! Your score: ' + score);
    // Let the canvas repaint before the blocking prompt appears.
    setTimeout(submitFlow, 50);
  }

  async function submitFlow() {
    const name = askName();
    state = 'submitting';
    draw();

    const problems = [];
    if (name !== null) {
      setStatus('Saving score...');
      const err = await postScore(name, score);
      if (err) {
        problems.push(err);
        setStatus('Score not saved.');
      } else {
        setStatus('Score saved for ' + name + '.');
      }
    } else {
      setStatus('Score not saved.');
    }

    const loadErr = await loadScores();
    if (loadErr) problems.push(loadErr);
    setNet(problems.join(' '));
    state = 'done';
    againBtn.hidden = false;
    draw();
  }

  // Ask for a name until a non-empty one is given, or the player cancels.
  // Returns the sanitised name (no spaces), or null if cancelled.
  function askName() {
    for (;;) {
      const raw = window.prompt('Game over! Your score: ' + score + '\nEnter your name:', lastName);
      if (raw === null) return null;
      const cleaned = raw.trim().replace(/\s+/g, '_');
      if (cleaned !== '') {
        lastName = cleaned;
        return cleaned;
      }
    }
  }

  // Returns null on success, or an error message for the page.
  async function postScore(name, value) {
    try {
      const res = await fetch(API_BASE + '/scores', {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: name + ' ' + value
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return null;
    } catch (err) {
      return 'Could not save score: backend unreachable at ' + API_BASE + '.';
    }
  }

  // Returns null on success, or an error message for the page.
  async function loadScores() {
    let entries = [];
    let problem = null;
    try {
      const res = await fetch(API_BASE + '/scores', { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      entries = parseScores(await res.text());
    } catch (err) {
      problem = 'Could not load scores: backend unreachable at ' + API_BASE + '.';
    }
    renderScores(entries);
    return problem;
  }

  // Backend format: up to ten lines, each "<name> <score>", highest first.
  function parseScores(text) {
    return text
      .split(/\r?\n/)
      .map(line => line.trim())
      .filter(line => line !== '')
      .slice(0, 10)
      .map(line => {
        const parts = line.split(/\s+/);
        const score = parts.pop();
        return { name: parts.join(' '), score: score };
      });
  }

  function renderScores(entries) {
    scoresEl.textContent = '';
    if (entries.length === 0) {
      const li = document.createElement('li');
      li.textContent = 'No scores yet.';
      li.style.listStyle = 'none';
      scoresEl.appendChild(li);
      return;
    }
    for (const e of entries) {
      const li = document.createElement('li');
      const sc = document.createElement('span');
      sc.className = 'sc';
      sc.textContent = e.score;
      li.appendChild(sc);
      li.appendChild(document.createTextNode(e.name));
      scoresEl.appendChild(li);
    }
  }

  // ---- Input --------------------------------------------------------------
  document.addEventListener('keydown', function (e) {
    const d = DIRS[e.key];
    if (!d) return;
    e.preventDefault();

    if (state === 'playing') {
      // Never allow reversing into the neck: compare against the applied direction.
      if (!isOpposite(d, dir)) nextDir = d;
    } else if (state === 'ready' || state === 'done') {
      startGame();
      if (!isOpposite(d, dir)) nextDir = d;
    }
    // 'over' and 'submitting' ignore arrow keys.
  });

  againBtn.addEventListener('click', function () {
    if (state === 'done') startGame();
  });

  // ---- Rendering ----------------------------------------------------------
  function draw() {
    ctx.fillStyle = '#0e0f12';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = '#16181d';
    ctx.lineWidth = 1;
    for (let i = 1; i < GRID; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL + 0.5, 0);
      ctx.lineTo(i * CELL + 0.5, canvas.height);
      ctx.moveTo(0, i * CELL + 0.5);
      ctx.lineTo(canvas.width, i * CELL + 0.5);
      ctx.stroke();
    }

    if (food) {
      ctx.fillStyle = '#e5534b';
      ctx.beginPath();
      ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 3, 0, Math.PI * 2);
      ctx.fill();
    }

    snake.forEach(function (s, i) {
      ctx.fillStyle = i === 0 ? '#7ee787' : '#2ea043';
      ctx.fillRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2);
    });

    if (state !== 'playing') {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = 'bold 22px system-ui, sans-serif';
      const lines = overlayLines();
      lines.forEach(function (text, i) {
        ctx.font = (i === 0 ? 'bold 22px' : '15px') + ' system-ui, sans-serif';
        ctx.fillText(text, canvas.width / 2, canvas.height / 2 - 14 + i * 26);
      });
    }
  }

  function overlayLines() {
    switch (state) {
      case 'ready':      return ['Snake', 'Press an arrow key to start'];
      case 'over':       return ['Game over', 'Score: ' + score];
      case 'submitting': return ['Game over', 'Saving score...'];
      case 'done':       return ['Game over', 'Press an arrow key to restart'];
      default:           return [];
    }
  }

  function updateScore() {
    scoreEl.textContent = 'Score: ' + score;
  }

  function setStatus(text) {
    statusEl.textContent = text;
  }

  function setNet(text) {
    netEl.textContent = text;
  }

  // ---- Init ---------------------------------------------------------------
  resetBoard();
  draw();
  loadScores().then(function (err) { setNet(err || ''); });
})();
</script>
</body>
</html>
