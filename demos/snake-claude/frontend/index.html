<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake</title>
<style>
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #1b1b1f;
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 0;
    padding: 16px;
  }
  h1 { margin: 8px 0; }
  canvas {
    background: #000;
    border: 2px solid #444;
    display: block;
  }
  #score { font-weight: bold; font-size: 1.2em; }
  #message { min-height: 1.5em; text-align: center; }
  #nameForm { display: flex; gap: 8px; align-items: center; }
  #nameForm[hidden] { display: none; }
  #error { color: #ff6b6b; min-height: 1.5em; text-align: center; }
  button { padding: 6px 14px; font-size: 1em; cursor: pointer; }
  #scoresBox { width: 400px; max-width: 100%; }
  #scores { padding-left: 2em; }
  #scores li { font-family: monospace; padding: 2px 0; }
</style>
</head>
<body>
<h1>Snake</h1>
<p>Score: <span id="score">0</span></p>
<canvas id="board" width="400" height="400"></canvas>
<p id="message">Use the arrow keys to steer.</p>

<form id="nameForm" hidden>
  <label for="nameInput">Your name:</label>
  <input id="nameInput" type="text" maxlength="30" autocomplete="off">
  <button type="submit">Save score</button>
</form>

<p><button id="newGame" type="button">New game</button></p>
<p id="error" role="alert"></p>

<div id="scoresBox">
  <h2>Top 10</h2>
  <ol id="scores"></ol>
</div>

<script>
// Backend endpoint. Change here if the backend moves.
const SCORES_URL = 'http://127.0.0.1:8765/scores';

const COLS = 20;
const ROWS = 20;
const CELL = 20;
const TICK_MS = 120;

const DIRS = {
  ArrowLeft:  { x: -1, y: 0 },
  ArrowRight: { x: 1,  y: 0 },
  ArrowUp:    { x: 0,  y: -1 },
  ArrowDown:  { x: 0,  y: 1 }
};

const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const messageEl = document.getElementById('message');
const nameForm = document.getElementById('nameForm');
const nameInput = document.getElementById('nameInput');
const newGameBtn = document.getElementById('newGame');
const errorEl = document.getElementById('error');
const scoresList = document.getElementById('scores');

let snake, dir, pending, food, score, gameOver, submitting, timer;

function placeFood() {
  // Pick a random free cell (the snake never fills the board in practice).
  let cell;
  do {
    cell = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
  } while (snake.some(s => s.x === cell.x && s.y === cell.y));
  return cell;
}

function newGame() {
  snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
  dir = { x: 1, y: 0 };
  pending = [];
  score = 0;
  gameOver = false;
  submitting = false;
  food = placeFood();

  scoreEl.textContent = '0';
  messageEl.textContent = 'Use the arrow keys to steer.';
  errorEl.textContent = '';
  nameForm.hidden = true;

  clearInterval(timer);
  timer = setInterval(tick, TICK_MS);
  draw();
}

function endGame() {
  gameOver = true;
  clearInterval(timer);
  draw();
  messageEl.textContent = `Game over! Score: ${score}. Enter your name to save it.`;
  nameInput.value = '';
  nameForm.hidden = false;
  nameInput.focus();
}

function tick() {
  if (gameOver) return;
  if (pending.length) dir = pending.shift();

  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  // Wall collision.
  if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS) {
    endGame();
    return;
  }

  const eating = head.x === food.x && head.y === food.y;

  // Self collision. The tail moves away this tick unless we are eating.
  const body = eating ? snake : snake.slice(0, -1);
  if (body.some(s => s.x === head.x && s.y === head.y)) {
    endGame();
    return;
  }

  snake.unshift(head);
  if (eating) {
    score += 1;
    scoreEl.textContent = String(score);
    food = placeFood();
  } else {
    snake.pop();
  }
  draw();
}

function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#e33';
  ctx.fillRect(food.x * CELL + 2, food.y * CELL + 2, CELL - 4, CELL - 4);

  ctx.fillStyle = '#3c3';
  for (const s of snake) {
    ctx.fillRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2);
  }

  if (gameOver) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 32px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
    ctx.textAlign = 'start';
  }
}

document.addEventListener('keydown', e => {
  // Leave arrow keys alone while the user is typing their name.
  if (e.target && e.target.tagName === 'INPUT') return;
  const d = DIRS[e.key];
  if (!d) return;
  e.preventDefault();
  if (gameOver) return;

  const last = pending.length ? pending[pending.length - 1] : dir;
  // Reject reversing into the body and repeating the same direction.
  if (d.x === -last.x && d.y === -last.y) return;
  if (d.x === last.x && d.y === last.y) return;
  if (pending.length < 3) pending.push(d);
});

function sanitizeName(raw) {
  const cleaned = String(raw).replace(/\s+/g, '');
  return cleaned || 'anon';
}

async function loadScores() {
  scoresList.innerHTML = '';
  try {
    const res = await fetch(SCORES_URL);
    if (!res.ok) throw new Error(`server responded with HTTP ${res.status}`);
    const text = await res.text();
    const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0).slice(0, 10);
    if (lines.length === 0) {
      const li = document.createElement('li');
      li.textContent = 'No scores yet.';
      scoresList.appendChild(li);
    }
    for (const line of lines) {
      const li = document.createElement('li');
      li.textContent = line;
      scoresList.appendChild(li);
    }
  } catch (err) {
    errorEl.textContent = `Could not load scores from ${SCORES_URL} (${err.message}).`;
  }
}

nameForm.addEventListener('submit', async e => {
  e.preventDefault();
  if (submitting) return;
  submitting = true;
  errorEl.textContent = '';

  const name = sanitizeName(nameInput.value);
  nameForm.hidden = true;
  messageEl.textContent = 'Saving score...';

  try {
    const res = await fetch(SCORES_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: `${name} ${score}`
    });
    if (!res.ok) throw new Error(`server responded with HTTP ${res.status}`);
  } catch (err) {
    errorEl.textContent = `Could not save score to ${SCORES_URL} (${err.message}). Try again.`;
    messageEl.textContent = `Game over! Score: ${score}.`;
    nameForm.hidden = false;
    submitting = false;
    return;
  }

  messageEl.textContent = `Saved ${name} ${score}. Press "New game" to play again.`;
  await loadScores();
  submitting = false;
});

newGameBtn.addEventListener('click', () => {
  newGame();
  loadScores();
});

newGame();
loadScores();
</script>
</body>
</html>
