name = "library"
packs = ["../pack"]                   # the agents and the formulas; the task comes from the user at the start

# The project has no rigs: its root is the directory the agents read and write in, filled by run.sh. The tracker
# stays here, next to loop-manager.toml.
[root]
path = "../library"

# The user's settings: what the agents of the pack run on here, and how.
[settings]
inherit_host = false                  # only what this config sets reaches the agents; the logins come from the host
# The permission mode is each harness's own setting: the demo runs unattended.
[settings.native.claude]
permission_mode = "bypassPermissions" # claude's `--permission-mode`
[settings.native.codex]
approval_policy = "never"             # codex's approval policy

[agents.glossarist]                   # the cheapest claude model, with a window of 200000
model = "haiku"
# The addon serves claude only. Its soft limit is far below what the documents take, so the agent reaches it and wraps
# up; the hard limit is the safety net past it.
addons = [{ name = "context-budget", params = { soft = 40000, hard = 150000, warn_step = 20000 } }]
