<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <header class="page-header">
      <div>
        <p class="eyebrow">A little arcade classic</p>
        <h1>Snake</h1>
      </div>
      <button id="start-button" class="primary" type="button">Start game</button>
    </header>

    <div class="layout">
      <section class="game-panel" aria-label="Snake game">
        <div class="stats">
          <div><span class="stat-label">Score</span><strong id="score">0</strong></div>
          <p id="game-status" role="status">Press Start or an arrow key to play.</p>
        </div>
        <canvas id="board" width="480" height="480" aria-label="Snake game board"></canvas>
        <p class="instructions">Move with <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> or <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd>. Eat the red food for 10 points. Avoid the walls and yourself.</p>
      </section>

      <aside class="scores-panel">
        <div class="panel-heading">
          <div><p class="eyebrow">Hall of fame</p><h2>High scores</h2></div>
          <button id="refresh-button" class="quiet" type="button">Refresh</button>
        </div>
        <p id="scores-message" class="muted" role="status">Loading scores…</p>
        <ol id="scores-list" class="scores-list"></ol>

        <form id="score-form" class="score-form" hidden>
          <label for="player-name">Save your score</label>
          <div class="submit-row">
            <input id="player-name" name="name" type="text" autocomplete="name" placeholder="Your name" required>
            <button id="submit-button" type="submit">Submit</button>
          </div>
          <p id="submit-message" class="muted" role="status"></p>
        </form>
      </aside>
    </div>
    <footer>Scores are saved locally by the game server.</footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
