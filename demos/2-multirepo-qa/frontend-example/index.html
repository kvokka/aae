<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake | Arcade</title>
  <link rel="stylesheet" href="style.css">
  <script src="game.js" defer></script>
</head>
<body>
  <main class="layout">
    <section class="game-panel" aria-labelledby="title">
      <header class="topbar">
        <div><p class="eyebrow">ARCADE CLASSIC</p><h1 id="title">Snake</h1></div>
        <div class="score-box"><span>Score</span><strong id="score">0</strong></div>
      </header>
      <p class="instructions">Eat the glowing food and grow. Use the arrow keys to steer. Don’t hit the walls or yourself.</p>
      <div class="board-wrap">
        <canvas id="board" width="480" height="480" aria-label="Snake game board"></canvas>
        <div id="overlay" class="overlay">
          <p id="overlay-title">Ready to play?</p>
          <span id="overlay-copy">Use the arrow keys to move</span>
          <button id="start-button" type="button">Start game</button>
        </div>
      </div>
      <div class="game-footer"><span id="game-status" aria-live="polite">Press start when you’re ready.</span><button id="restart-button" class="secondary" type="button">Restart</button></div>
      <form id="submit-form" class="submit-form" hidden>
        <label for="player-name">Add your score to the board</label>
        <div class="submit-row"><input id="player-name" name="name" maxlength="20" required autocomplete="nickname" placeholder="Your name"><button id="submit-button" type="submit">Submit score</button></div>
        <span id="submit-status" aria-live="polite"></span>
      </form>
    </section>
    <aside class="scores-panel" aria-labelledby="scores-title">
      <p class="eyebrow">THE LEADERBOARD</p><h2 id="scores-title">High scores</h2>
      <p class="scores-note">Top ten players</p>
      <ol id="high-scores" class="high-scores"><li class="muted">Loading scores…</li></ol>
      <p id="scores-status" class="scores-status" aria-live="polite"></p>
    </aside>
  </main>
</body>
</html>
