name = "deliver"
description = "A request becomes beads per rig, coders do them, and checks send the work back until it holds"
rounds = 3                                  # at most three rounds of checks and returns

[inputs]
task = { type = "task", required = true }   # the request: its text becomes the root bead

[[step]]
name = "plan"
kind = "ai"
agent = "planner"
timeout = "20m"

[[step]]
name = "work"
kind = "drain"
formula = "implement"                       # a run per ready bead under the root, on the rig of the prefix of its id
pool = 2                                    # two beads, two rigs, in work at once

# The format of the Markdown in every rig: rumdl fixes what it can; what it cannot goes back to the planner.
# A rig may sit in a repository that ignores it, so the check does not respect .gitignore and skips what tools fetch.
[[step]]
name = "format"
kind = "exec"
command = ["sh", "-c", """
set -e
run=$(loop-manager --json run show "$LOOP_MANAGER_RUN")
rigs=$(loop-manager --json project list --project "$(printf '%s' "$run" | jq -r .project)")
n=$(printf '%s' "$rigs" | jq '[.[].rigs[]] | length')
[ "$n" -gt 0 ] || { echo "format: the project has no rigs" >&2; exit 1; }
printf '%s' "$rigs" | jq -j '.[].rigs[].path + "\\u0000"' |
  xargs -0 rumdl check --fix --respect-gitignore=false --exclude '.git,node_modules,.venv'
"""]
back_to = "plan"

# The project's own conditions, tried as a user would; a failure goes back to the planner with what failed.
[[step]]
name = "qa"
kind = "ai"
agent = "qa"
timeout = "20m"
back_to = "plan"
