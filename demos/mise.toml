# The demos of spec §15 run real models: they need the harness logins and spend tokens, so they run only here, by
# hand. CI runs only `check`. claude, codex and jq come from the repository's mise.toml.
[tools]
python = "3.15.0"                     # the backend and the smoke test

[tasks.check]
description = "Both demos load: the pack, the projects and the user's settings"
run = "aae config check --config snake-claude/root/config.toml && aae config check --config snake-mixed/root/config.toml"

[tasks.snake-claude]
description = "Demo 1: a planner and its workers on claude haiku, from the request to a green smoke test"
run = "./run.sh snake-claude"

[tasks.snake-mixed]
description = "Demo 2: the same with the backend worker on codex"
run = "./run.sh snake-mixed"
