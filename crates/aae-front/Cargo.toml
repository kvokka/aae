[package]
name = "aae-front"
description = "Frontends of aae: the HTTP API on a unix socket and its client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
aae-core = { version = "0.1.0", path = "../aae-core" }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["net", "rt", "sync", "macros", "io-util", "time"] }
tokio-stream = "0.1.19"
utoipa = { version = "6.0.0", features = ["axum_extras"] }
utoipa-axum = "0.3.0"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
