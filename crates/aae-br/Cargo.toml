[package]
name = "aae-br"
description = "The br tracker adapter of aae"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
aae-core = { version = "0.1.0", path = "../aae-core" }
notify = "8.2.2"
rusqlite = { version = "0.42", features = ["bundled"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["process", "rt"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
