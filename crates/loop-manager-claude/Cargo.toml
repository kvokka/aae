[package]
name = "loop-manager-claude"
description = "The claude adapter of loop-manager: claude -p over stream-json"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
loop-manager-contract = { version = "0.0.1", path = "../loop-manager-contract" }
rustix = { version = "1.1.6", features = ["process"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "process", "io-util", "macros"] }
uuid = { version = "1.29.2", features = ["v4", "v5"] }

[dev-dependencies]
loop-manager-testkit = { version = "0.0.1", path = "../loop-manager-testkit" }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "macros", "time"] }
