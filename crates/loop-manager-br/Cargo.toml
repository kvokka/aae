[package]
name = "loop-manager-br"
description = "The br tracker adapter of loop-manager"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
# With `test = false` a `#[test]` here is silently never run: whoever adds one removes this key first.
test = false

[lints]
workspace = true

[dependencies]
loop-manager-contract = { version = "0.0.1", path = "../loop-manager-contract" }
# kqueue, not the default FSEvents backend: FSEvents links macOS frameworks that `cargo zigbuild` has no SDK for.
notify = { version = "8.2.2", default-features = false, features = ["macos_kqueue"] }
rusqlite = { version = "0.42", features = ["bundled"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["process", "rt", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
