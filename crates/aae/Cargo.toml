[package]
name = "aae"
description = "Adaptive Agent Executor: an event-driven orchestrator for coding agents"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
aae-br = { version = "0.1.0", path = "../aae-br" }
aae-claude = { version = "0.1.0", path = "../aae-claude" }
aae-codex = { version = "0.1.0", path = "../aae-codex" }
aae-core = { version = "0.1.0", path = "../aae-core" }
aae-front = { version = "0.1.0", path = "../aae-front" }
aae-plugins = { version = "0.1.0", path = "../aae-plugins" }
clap = "4.6.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "signal", "macros"] }
toml = "1.2.1"

[dev-dependencies]
aae-testkit = { version = "0.1.0", path = "../aae-testkit" }
rusqlite = "0.42.0"
tempfile = "3.27.0"
