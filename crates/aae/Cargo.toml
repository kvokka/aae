[package]
name = "aae"
description = "Adaptive Agent Executor: an event-driven orchestrator for coding agents"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
aae-claude = { version = "0.1.0", path = "../aae-claude" }
aae-core = { version = "0.1.0", path = "../aae-core" }
aae-front = { version = "0.1.0", path = "../aae-front" }
clap = "4.6.7"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "signal", "macros"] }

[dev-dependencies]
aae-testkit = { version = "0.1.0", path = "../aae-testkit" }
tempfile = "3.27.0"
