[package]
name = "aae-claude"
description = "The claude adapter of aae: claude -p over stream-json"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
aae-core = { version = "0.1.0", path = "../aae-core" }
rustix = { version = "1.1.6", features = ["process"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "process", "io-util", "macros"] }
uuid = { version = "1.29.2", features = ["v4", "v5"] }

[dev-dependencies]
aae-testkit = { path = "../aae-testkit" }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "macros", "time"] }
