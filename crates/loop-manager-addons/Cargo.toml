[package]
name = "loop-manager-addons"
description = "The addons bundled with loop-manager: default-policy and worktree"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
loop-manager-contract = { version = "0.1.0", path = "../loop-manager-contract" }
rustix = { version = "1.1.6", features = ["process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"
