[package]
name = "aae-testkit"
description = "Test doubles of aae: the scripted driver and fake providers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
aae-core = { version = "0.1.0", path = "../aae-core" }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "time", "sync", "net"] }
tokio-stream = "0.1.19"

[dev-dependencies]
aae-plugins = { version = "0.1.0", path = "../aae-plugins" }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "test-util", "io-util", "net"] }
