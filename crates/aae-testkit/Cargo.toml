[package]
name = "aae-testkit"
description = "Test doubles of aae: the scripted driver"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
aae-core = { version = "0.1.0", path = "../aae-core" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "time", "sync"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "test-util"] }
