[package]
name = "aae-acceptance"
description = "The acceptance spec of aae (spec §9.2, §15): scenarios on a real daemon and real binaries"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
aae-front = { version = "0.1.0", path = "../aae-front" }
aae-testkit = { version = "0.1.0", path = "../aae-testkit" }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "process", "net"] }
