[package]
name = "aae-codex"
description = "The codex adapter of aae: codex app-server over stdio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
aae-core = { version = "0.1.0", path = "../aae-core" }
rustix = { version = "1.1.6", features = ["process"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "process", "io-util", "macros"] }
toml = "1.2.1"

[dev-dependencies]
aae-testkit = { version = "0.1.0", path = "../aae-testkit" }
tempfile = "3.27.0"
