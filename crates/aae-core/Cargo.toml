[package]
name = "aae-core"
description = "Core of aae: the single writer of the runtime state"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
rusqlite = { version = "0.42.0", features = ["bundled", "serde_json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "macros"] }
toml = "1.2.1"
uuid = { version = "1.29.2", features = ["v5"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "test-util"] }
