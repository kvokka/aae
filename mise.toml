[tools]
rust = { version = "1.100", components = "clippy,rustfmt,rust-src,rust-analyzer" }
"cargo:cargo-nextest" = "0.9.151"
"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-machete" = "0.9.2"
claude = "2.1"
codex = "0"
"github:Dicklesworthstone/beads_rust" = "0.7.6"
"github:Dicklesworthstone/beads_viewer" = "0.26.0"
"github:Dicklesworthstone/destructive_command_guard" = "0.16.0"
jq = "1.8.2"
rumdl = "0.3.4"

[tasks.bv]
description = "View the devloop tracker grouped by status"
dir = "{{config_root}}/devloop"
run = "bv --recipe default"

[tasks.devloop-install]
description = "Install the existing debug binary for devloop"
dir = "{{config_root}}"
run = "devloop/scripts/install.sh"

[tasks.test]
description = "Unit and integration tests; the local loop. The chaos stand is an acceptance row (criterion 35)"
run = "cargo nextest run --locked -E 'not binary(chaos)'"

[tasks.ci]
description = "Run all CI checks and report every failure"
run = """
mkdir -p target/ci
report=${DEVLOOP_CI_REPORT:-$(mktemp target/ci/checks.XXXXXX)}
rc=0
mise run --jobs 1 --continue-on-error --timeout 5m --report-file "$report" 'ci:*' || rc=$?
echo "CI report: $report"
exit "$rc"
"""

[tasks."ci:fmt"]
run = "cargo fmt --all --check"

[tasks."ci:clippy"]
run = "cargo clippy --workspace --all-targets --locked -q -- -D warnings"

[tasks."ci:tests"]
# The chaos stand belongs to acceptance criterion 35.
run = "cargo nextest run --workspace --locked --no-fail-fast --no-tests=warn -E 'not binary(chaos)'"

[tasks."ci:deny"]
run = "cargo deny check"

[tasks."ci:machete"]
run = "cargo machete"

[tasks."ci:unused-pub"]
run = "scripts/unused-pub.sh"

[tasks."ci:core-boundary"]
run = "scripts/core-boundary.sh"

[tasks."ci:select-biased"]
run = "scripts/select-biased.sh"

[tasks."ci:measure-selftest"]
run = "scripts/measure-selftest.sh"

[tasks."ci:measure"]
run = "scripts/measure.sh"

[tasks."ci:home-paths"]
run = """rc=0; git grep -nE '/(home|Users)/[A-Za-z]' -- . ':!.loop' || rc=$?; test "$rc" = 1"""

[tasks."ci:test-constructor"]
run = """rc=0; git grep -n 'CARGO_BIN_EXE_loop-manager' -- crates ':!crates/loop-manager/tests/common' || rc=$?; test "$rc" = 1"""

[tasks."ci:devloop-config"]
run = "cargo run -q --locked -p loop-manager -- config check --config devloop/config.toml"

[tasks."ci:devloop-selftest"]
run = """
cargo build -q --locked -p loop-manager
metadata=$(cargo metadata --locked --no-deps --format-version 1)
target=$(echo "$metadata" | jq -er .target_directory)
PATH="$target/debug:$PATH" devloop/scripts/selftest.sh
"""

[tasks.acceptance]
description = "The whole acceptance spec (docs/acceptance.md) on the release build of loop-manager; scenarios with a real model cost money and need a login"
run = [
  "cargo build -q --locked --release -p loop-manager",
  "cargo run -q --locked -p loop-manager-acceptance -- --loop-manager {{config_root}}/target/release/loop-manager",
]

[tasks.acceptance-ci]
description = "The model-free acceptance scenarios; run on request"
run = [
  "cargo build -q --locked -p loop-manager",
  "cargo run -q --locked -p loop-manager-acceptance -- --ci",
]
