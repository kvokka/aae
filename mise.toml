[tools]
rust = { version = "1.100", components = "clippy,rustfmt,rust-src,rust-analyzer", targets = "aarch64-unknown-linux-musl,x86_64-unknown-linux-musl,aarch64-apple-darwin,x86_64-apple-darwin" }
"cargo:cargo-nextest" = "0.9.151"
"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-machete" = "0.9.2"
zig = "0.17.1"
"cargo:cargo-zigbuild" = "0.24.1"
claude = "2.1"
codex = "0"
"github:Dicklesworthstone/beads_rust" = "0.7.6"
"github:Dicklesworthstone/destructive_command_guard" = "0.16.0"
jq = "1.8.2"
rumdl = "0.3.4"

[tasks.devloop-install]
description = "Install the existing debug binary for devloop"
dir = "{{config_root}}"
run = "devloop/scripts/install.sh"

[tasks.test]
description = "Unit and integration tests; the local loop. The chaos stand is an acceptance row (criterion 35)"
run = "cargo nextest run --locked -E 'not binary(chaos)'"

[tasks.ci]
description = "Checks that CI runs on every commit"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets --locked -q -- -D warnings",
  # Without the chaos stand: its 1000 seeds are acceptance criterion 35 (docs/acceptance.md).
  "cargo nextest run --workspace --locked --no-tests=warn -E 'not binary(chaos)'",
  "cargo deny check",
  "cargo machete",
  "scripts/unused-pub.sh",
  "scripts/core-boundary.sh",
  "scripts/select-biased.sh",
  "scripts/measure-selftest.sh",
  "scripts/measure.sh",
  # The repository is public: no absolute home paths of the machine the demos or tests ran on.
  "! git grep -nE '/(home|Users)/[A-Za-z]' -- . ':!.loop'",
  # Tests may run inside a loop-manager session: they start the binary only through `common` (docs/agents/rules-tests.md).
  "! git grep -n 'CARGO_BIN_EXE_loop-manager' -- crates ':!crates/loop-manager/tests/common'",
  # The pack that develops loop-manager with loop-manager (devloop/README.md): its scripts on sample files, and its
  # config loads.
  "cargo run -q --locked -p loop-manager -- config check --config devloop/config.toml",
  '''PATH="$(cargo metadata --locked --no-deps --format-version 1 | jq -r .target_directory)/debug:$PATH" devloop/scripts/selftest.sh''',
]

[tasks.build-all]
description = "Release builds for the four targets"
run = """
for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl x86_64-apple-darwin aarch64-apple-darwin; do
  cargo zigbuild --release --locked --target "$t"
done
"""

[tasks.acceptance]
description = "The whole acceptance spec (docs/acceptance.md) on the release build of loop-manager; scenarios with a real model cost money and need a login"
run = [
  "cargo build -q --locked --release -p loop-manager",
  "cargo run -q --locked -p loop-manager-acceptance -- --loop-manager {{config_root}}/target/release/loop-manager",
]

[tasks.acceptance-release]
description = "Criterion 1 of the acceptance with the four release targets, and this host's build runs; CI runs it on tags"
run = "cargo run -q --locked -p loop-manager-acceptance -- --release 1"

[tasks.acceptance-ci]
description = "The model-free acceptance scenarios, without the release builds; run on request"
run = [
  "cargo build -q --locked -p loop-manager",
  "cargo run -q --locked -p loop-manager-acceptance -- --ci",
]
