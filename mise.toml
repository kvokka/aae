[tools]
rust = { version = "1.100", components = "clippy,rustfmt,rust-src,rust-analyzer", targets = "aarch64-unknown-linux-musl,x86_64-unknown-linux-musl,aarch64-apple-darwin,x86_64-apple-darwin" }
"cargo:cargo-nextest" = "0.9.151"
"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-machete" = "0.9.2"
tokei = "15.0.0"
zig = "0.17.1"
"cargo:cargo-zigbuild" = "0.24.1"
claude = "2.1"
codex = "0"
"github:Dicklesworthstone/beads_rust" = "0.7.6"
jq = "1.8.2"
rumdl = "0.3.4"

[tasks.test]
description = "Unit and integration tests; the local loop. The chaos stand is an acceptance row (criterion 35)"
run = "cargo nextest run --locked -E 'not binary(chaos)'"

[tasks.ci]
description = "Checks that CI runs on every commit"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets --locked -q -- -D warnings",
  # Without the chaos stand: its 1000 seeds are acceptance criterion 35 (docs/acceptance.md).
  "cargo nextest run --workspace --locked --no-tests=warn -E 'not binary(chaos)'",
  "cargo deny check",
  "cargo machete",
  "scripts/unused-pub.sh",
  "scripts/core-boundary.sh",
  "scripts/select-biased.sh",
  "scripts/budget-selftest.sh",
  "scripts/budget.sh",
  # The repository is public: no absolute home paths of the machine the demos or tests ran on.
  "! git grep -nE '/(home|Users)/[A-Za-z]' -- . ':!.loop'",
]

[tasks.build-all]
description = "Release builds for the four targets"
run = """
for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl x86_64-apple-darwin aarch64-apple-darwin; do
  cargo zigbuild --release --locked --target "$t"
done
"""

[tasks.acceptance]
description = "The whole acceptance spec (docs/acceptance.md) on the release build of aae; scenarios with a real model cost money and need a login"
run = [
  "cargo build -q --locked --release -p aae",
  "cargo run -q --locked -p aae-acceptance -- --aae {{config_root}}/target/release/aae",
]

[tasks.acceptance-release]
description = "Criterion 1 of the acceptance with the four release targets, and this host's build runs; CI runs it on tags"
run = "cargo run -q --locked -p aae-acceptance -- --release 1"

[tasks.acceptance-ci]
description = "The model-free acceptance scenarios, without the release builds; run on request"
run = [
  "cargo build -q --locked -p aae",
  "cargo run -q --locked -p aae-acceptance -- --ci",
]
