[settings]
lockfile = true

[tools]
rust = { version = "1.99.1", components = "clippy,rustfmt,rust-src,rust-analyzer", targets = "aarch64-unknown-linux-musl,x86_64-unknown-linux-musl,aarch64-apple-darwin,x86_64-apple-darwin" }
"cargo:cargo-nextest" = "0.9.151"
"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-machete" = "0.9.2"
tokei = "15.0.0"
zig = "0.17.1"
"cargo:cargo-zigbuild" = "0.24.1"
claude = "2.1"
codex = "0"
"github:Dicklesworthstone/beads_rust" = "0.7.6"
jq = "1.8.2"

[tasks.ci]
description = "Checks that CI runs on every commit"
run = [
  "cargo fmt --all --check",
  "cargo clippy --all-targets --locked -q -- -D warnings",
  # A share of the invariant stand's seeds keeps the job short; `acceptance-ci` plays all of them.
  "AAE_CHAOS_SEEDS=400 cargo nextest run --locked --no-tests=warn",
  "cargo deny check",
  "cargo machete",
  "scripts/unused-pub.sh",
  "scripts/budget-selftest.sh",
  "scripts/budget.sh",
]

[tasks.build-all]
description = "Release builds for the four targets of spec §13"
run = """
for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl x86_64-apple-darwin aarch64-apple-darwin; do
  cargo zigbuild --release --locked --target "$t"
done
"""

[tasks.acceptance]
description = "The whole acceptance spec (spec §9.2, §15); scenarios with a real model cost money and need a login"
run = ["cargo build -q --locked -p aae", "cargo run -q --locked -p aae-acceptance"]

[tasks.acceptance-ci]
description = "The acceptance scenarios without a model, as CI runs them"
run = [
  "cargo build -q --locked -p aae",
  "cargo run -q --locked -p aae-acceptance -- --ci",
  "cargo nextest run --locked -p aae-testkit --test chaos",
]
