[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["experiments"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/kvokka/aae"
rust-version = "1.99"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "deny"

[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

# Line tables keep file:line in backtraces at half the target/ size and link time.
[profile.dev]
debug = "line-tables-only"
# The invariant stand and the scenarios run a lot of code; unoptimised they are several times slower.
opt-level = 1

[profile.dev.package."*"]
debug = false
opt-level = 2

[profile.release]
lto = true
codegen-units = 1
strip = true
