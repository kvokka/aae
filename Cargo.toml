[workspace]
resolver = "3"
members = ["crates/*"]
# Everything but the acceptance runner, which is needed only on request: `cargo build`, `clippy` and `nextest` without
# `-p` or `--workspace` leave it out. The gate (`mise run ci`) checks the whole workspace.
default-members = [
  "crates/loop-manager",
  "crates/loop-manager-br",
  "crates/loop-manager-claude",
  "crates/loop-manager-codex",
  "crates/loop-manager-contract",
  "crates/loop-manager-core",
  "crates/loop-manager-front",
  "crates/loop-manager-addons",
  "crates/loop-manager-testkit",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/kvokka/loop-manager"
rust-version = "1.100"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "deny"

[workspace.lints.clippy]
too_many_lines = "warn"
excessive_nesting = "warn"
cognitive_complexity = "warn"
allow_attributes_without_reason = "warn"
unnecessary_wraps = "warn"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# Denied by the root of each daemon crate (`clippy.toml`); tests and the acceptance runner spawn freely.
disallowed_methods = "allow"

# No debug info: a rebuild writes half as much to disk and a test binary is a third of the size. A panic still names
# its file and line; the frames of a backtrace get theirs back for one command (docs/agents/rules-tests.md).
[profile.dev]
debug = false
# The invariant stand and the scenarios run a lot of code; unoptimised they are several times slower.
opt-level = 1

# `debug` stays explicit here: that one command then rebuilds the workspace crates only.
[profile.dev.package."*"]
debug = false
opt-level = 2

[profile.release]
lto = true
codegen-units = 1
strip = true
